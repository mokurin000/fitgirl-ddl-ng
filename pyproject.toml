[project]
name = "fitgirl-ddl-ng"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "zendriver @ git+https://github.com/mokurin000/zendriver@feat/support-edge",
]

[tool.uv]
package = true

[project.scripts]
refresh-cookies = "fitgirl_ddl_ng.refresh_cookies.__main__:app"
scrape-fitgirl = "fitgirl_ddl_ng.scrape_links.__main__:app"
extract-ddl = "fitgirl_ddl_ng.extract_ddl.__main__:app"

[project.optional-dependencies]
cli = [
    "questionary>=2.1.1",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
]
gui = [
    "wxpython>=4.3.1",
]
