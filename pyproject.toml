[project]
name = "fitgirl-ddl-ng"
version = "0.4.10"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "sentry-sdk>=2.70.0",
    "zendriver>=0.16.0",
]

[tool.uv]
package = true

[project.scripts]
scrape-fitgirl = "fitgirl_ddl_ng.scrape_links.__main__:app"
extract-ddl = "fitgirl_ddl_ng.extract_ddl.__main__:app"

[project.optional-dependencies]
cli = [
    "questionary>=2.1.1",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
]
gui = [
    "wxpython>=4.3.1",
]
